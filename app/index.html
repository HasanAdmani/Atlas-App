<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui}</style></head><body>
<title>Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: slim left index rail + one wide working column. Display serif for numerals and titles only; data in mono. */
:root{
  --bg:#ECEEEA; --surface:#F7F8F5; --sunk:#E2E5E0; --ink:#18201D; --muted:#66716B; --line:#D3D8D1;
  --accent:#2B3FA0; --accent-ink:#FFFFFF; --accent-soft:#DDE2F4;
  --good:#2D7A58; --warn:#A9701A; --bad:#B03A3A; --good-soft:#D9EBE1; --warn-soft:#F2E6CF; --bad-soft:#F1DADA;
  --f-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#18201D; --sunk:#0C100F; --ink:#E6ECE8; --muted:#8B9792; --line:#2A3430;
  --accent:#95A5F6; --accent-ink:#101513; --accent-soft:#222A4D;
  --good:#6CC49A; --warn:#E0B04F; --bad:#E88383; --good-soft:#1B3328; --warn-soft:#3A2F17; --bad-soft:#3B2020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#18201D; --sunk:#0C100F; --ink:#E6ECE8; --muted:#8B9792; --line:#2A3430;
  --accent:#95A5F6; --accent-ink:#101513; --accent-soft:#222A4D;
  --good:#6CC49A; --warn:#E0B04F; --bad:#E88383; --good-soft:#1B3328; --warn-soft:#3A2F17; --bad-soft:#3B2020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.gc{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;margin-bottom:12px}
.gh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ir{display:grid;grid-template-columns:minmax(90px,1fr) 58px 58px 38px 128px 96px 30px;gap:6px;align-items:center;margin-bottom:6px}
.ir input,.ir select{width:100%;padding:5px 6px}
.ir.ih{font:500 10px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media (max-width:640px){.ir{grid-template-columns:repeat(4,minmax(0,1fr)) 30px}.ir>.nm,.ir.ih>span:first-child{grid-column:1/-1}.ir.ih{display:none}.ir>span.mono{display:none}}
details>summary{cursor:pointer;font:600 12px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:14px}
details>summary::after{content:' +'}
details[open]>summary::after{content:' −'}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;max-width:1440px;margin:0 auto;padding-block:20px 80px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding-top:8px;display:flex;flex-direction:column;gap:28px}
.brand{font:400 30px/1 var(--f-display);letter-spacing:-.01em}
.brand i{color:var(--accent)}
.brand small{display:block;margin-top:6px;font:400 11px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:baseline;text-decoration:none;color:var(--muted);padding:7px 10px;border-radius:6px;font-weight:500}
.nav a span{font:400 11px var(--f-mono);opacity:.7}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 2px 0 0 var(--accent)}
.sidefoot{font:400 11px/1.5 var(--f-mono);color:var(--muted)}
.sidefoot button{margin-top:6px}
.main{min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font:400 clamp(34px,5vw,52px)/1.02 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font:600 12px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h3{font:600 15px/1.3 var(--f-body);margin:0}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.sec{margin-top:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.flat{border-top:1px solid var(--line);padding-top:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.num{font:400 clamp(44px,7vw,76px)/.95 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{width:100%;resize:vertical;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:4px}
label.f>span{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--f-mono);padding:4px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.d{background:var(--good)}
.bar>i.p{background:var(--accent-soft)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.r,.t th.r{text-align:right}
.t input{width:100%}
.t input.w{width:70px;text-align:right}
.scroll{overflow-x:auto}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover h3{color:var(--accent)}
.code{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:22px;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring>div{width:86px;height:86px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:400 28px var(--f-display)}
/* four-year grid */
.termwrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.term{flex:0 0 218px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:150px}
.term.over{border-color:var(--accent);background:var(--accent-soft)}
.term header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.term header b{font:400 19px var(--f-display)}
.cc{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;margin-bottom:7px;cursor:grab;position:relative}
.cc.done{border-left:3px solid var(--good)}
.cc.current{border-left:3px solid var(--accent)}
.cc.planned{border-left:3px dashed var(--muted)}
.cc .t1{display:flex;justify-content:space-between;gap:6px}
.cc .t2{font-size:13px;line-height:1.3;margin-top:2px}
.cc.warn{outline:1px solid var(--warn)}
.cc.sel{outline:2px solid var(--accent)}
/* roadmap */
.map{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.map svg{display:block}
.map .nd{cursor:pointer}
.map .nd rect{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.map .nd.done rect{fill:var(--good-soft);stroke:var(--good)}
.map .nd.current rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.map .nd.planned rect{stroke:var(--muted);stroke-dasharray:4 3}
.map .nd.open rect{stroke:var(--accent);stroke-dasharray:2 3}
.map .nd.dim{opacity:.22}
.map .nd text{fill:var(--ink)}
.map .nd .c{font:500 11px var(--f-mono);fill:var(--muted)}
.map .nd .n{font:500 12px var(--f-body)}
.map path.ed{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.55}
.map path.ed.hi{stroke:var(--accent);opacity:1;stroke-width:2}
.map path.ed.dim{opacity:.08}
.map .colh{font:500 10px var(--f-mono);fill:var(--muted);letter-spacing:.08em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:400 12px var(--f-mono);color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--muted)}
/* drawer */
.veil{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:22px max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 22px;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.drawer h1{font-size:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.spark{display:block;width:100%;height:auto}
.gl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:40}
.pre{white-space:pre-wrap;font:400 13px/1.5 var(--f-mono);background:var(--sunk);border-radius:8px;padding:12px;max-height:260px;overflow:auto}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:14px 80px}
  .side{position:static;gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap;padding:7px 11px}
  .nav a span{display:none}
  .nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .sidefoot{display:none}
}
@media (prefers-reduced-motion:no-preference){.veil{animation:fi .15s ease}.drawer{animation:sl .2s ease}@keyframes fi{from{opacity:0}}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.cols .sec{margin-top:0!important}
.wk{display:grid;gap:0;font-size:12px}.wkh{text-align:center;padding:4px 0;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px}
.wkt{position:absolute;right:6px;transform:translateY(-6px);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px}
.wkc{position:relative;border-left:1px solid var(--line)}.wkc i{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.wkb{position:absolute;left:2px;right:2px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid var(--accent);border-radius:5px;padding:2px 5px;overflow:hidden;line-height:1.25}
.wkb.bad{background:color-mix(in srgb,var(--bad) 25%,transparent);border-color:var(--bad)}.wkb span{color:var(--muted)}
</style>

/* ---------- calculations ---------- */
const termOf=id=>S.terms.find(t=>t.id===id);
const termIdx=id=>S.terms.findIndex(t=>t.id===id);
const byCode=()=>{const m={};S.courses.slice().sort((a,b)=>termIdx(a.term)-termIdx(b.term)).forEach(c=>m[NC(c.code)]=c);return m};
/* a retaken course: the old attempt stops counting toward credits, and (if the setting is on) toward GPA once the retake has a grade */
const counts=c=>!S.courses.some(o=>o.retakeOf===c.id);
const replaced=c=>S.settings.retakeReplaces!==false&&S.courses.some(o=>o.retakeOf===c.id&&o.grade&&o.grade!=='W');
const getC=id=>S.courses.find(c=>c.id===id);
function status(c){const t=termOf(c.term);return t?t.status:'catalog'}
const pointsOf=l=>{const e=S.settings.scale.find(x=>x.l===l);return e?e.p:null};
function letterFor(pct){const sc=S.settings.scale.slice().sort((a,b)=>b.min-a.min);for(const e of sc)if(pct>=e.min)return e.l;return sc.length?sc[sc.length-1].l:null}
const ipct=it=>(it.s!=null&&it.s!==''&&+it.m>0&&it.st!=='excused')?(+it.s)/(+it.m)*100:null;
/* one grading group, like "Quizzes 20%, best 8 of 10". Ungraded items are left out, and the lowest ones are dropped once there are more than count minus drop. */
function gstat(g){
  const items=g.items||[],n=Math.max(+g.cnt||0,items.length,1),k=Math.max(1,n-(+g.drop||0));
  const ps=items.map(ipct).filter(p=>p!=null).sort((a,b)=>b-a),used=ps.slice(0,k),portion=used.length/k;
  const mean=used.length?used.reduce((a,b)=>a+b,0)/used.length:null,w=+g.w||0;
  return{n,k,graded:ps.length,used:used.length,mean,portion,gw:w*portion,ew:mean==null?0:w*portion*mean/100};
}
function standing(c){
  const as=c.assess||[],gs=as.map(gstat);
  const W=as.reduce((a,g)=>a+(+g.w||0),0),gw=gs.reduce((a,x)=>a+x.gw,0),earned=gs.reduce((a,x)=>a+x.ew,0);
  const pct=gw>0?earned/gw*100:null;
  return{W,gw,earned,pct,rem:W-gw,letter:pct==null?null:letterFor(pct),floor:W>0?earned/W*100:null,ceil:W>0?(earned+(W-gw))/W*100:null};
}
function needed(c,target){const st=standing(c);if(st.W<=0||st.rem<=0)return null;return (target/100*st.W-st.earned)/st.rem*100}
function effLetter(c){if(c.grade)return c.grade;const st=standing(c);return st.letter}
function gpaOf(list,useRunning,over){
  let pts=0,cr=0;
  list.forEach(c=>{
    if(replaced(c)||(over&&S.settings.retakeReplaces!==false&&S.courses.some(o=>o.retakeOf===c.id&&over[o.id])))return;
    let l=over&&over[c.id]?over[c.id]:(c.grade||(useRunning?standing(c).letter:null));
    if(!l||l==='W')return;const p=pointsOf(l);if(p==null)return;pts+=p*c.credits;cr+=c.credits;
  });
  return{gpa:cr?pts/cr:null,pts,cr};
}
const doneCourses=()=>S.courses.filter(c=>status(c)==='done');
const curCourses=()=>S.courses.filter(c=>status(c)==='current');
const planCourses=()=>S.courses.filter(c=>status(c)==='planned');
function cumulative(){return gpaOf(doneCourses(),false)}
const passed=c=>!c.grade||c.grade==='CR'||(c.grade!=='W'&&c.grade!=='NC'&&(pointsOf(c.grade)||0)>0);
function earnedCredits(){return doneCourses().filter(counts).filter(passed).reduce((a,c)=>a+c.credits,0)}
function termGpa(t){return gpaOf(S.courses.filter(c=>c.term===t.id),t.status==='current')}
function trend(){
  const out=[];let pts=0,cr=0;
  S.terms.forEach(t=>{
    if(t.status==='planned')return;
    const cs=S.courses.filter(c=>c.term===t.id);
    const g=gpaOf(cs,t.status==='current');
    pts+=g.pts;cr+=g.cr;
    if(g.cr)out.push({name:t.name,term:g.gpa,cum:pts/cr,cur:t.status==='current'});
  });
  return out;
}
function prereqIssues(c){
  const m=byCode(),out=[],ti=c.term?termIdx(c.term):-1;
  (c.prereqs||[]).forEach(code=>{
    const p=m[NC(code)];
    if(!p){out.push({code,kind:'missing'});return}
    if(!c.term)return;
    const pi=p.term?termIdx(p.term):-1;
    if(!p.term)out.push({code:p.code,kind:'unscheduled'});
    else if(pi>=ti)out.push({code:p.code,kind:pi===ti?'same':'after'});
  });
  (c.coreqs||[]).forEach(code=>{const p=m[NC(code)];if(!p){out.push({code,kind:'missing'});return}if(!c.term)return;const pi=p.term?termIdx(p.term):-1;if(!p.term)out.push({code:p.code,kind:'unscheduled'});else if(pi>ti)out.push({code:p.code,kind:'after'})});
  return out;
}
function depth(c,m,seen){
  seen=seen||{};if(seen[c.id])return 0;seen[c.id]=1;
  let d=0;(c.prereqs||[]).forEach(code=>{const p=m[NC(code)];if(p)d=Math.max(d,1+depth(p,m,Object.assign({},seen)))});
  return d;
}
function nodeState(c,m){
  const st=status(c);
  if(st==='done')return'done';if(st==='current')return'current';if(st==='planned')return'planned';
  const ok=(c.prereqs||[]).every(code=>{const p=m[NC(code)];return !p||status(p)==='done'||status(p)==='current'});
  return ok?'open':'locked';
}
function catProgress(){
  return S.settings.cats.map(k=>{
    const cs=S.courses.filter(c=>c.cat===k.k&&counts(c));
    const e=cs.filter(c=>status(c)==='done'&&passed(c)).reduce((a,c)=>a+c.credits,0);
    const cu=cs.filter(c=>status(c)==='current').reduce((a,c)=>a+c.credits,0);
    const pl=cs.filter(c=>status(c)==='planned').reduce((a,c)=>a+c.credits,0);
    return{k,e,cu,pl,left:Math.max(0,k.req-e-cu-pl),over:Math.max(0,e+cu+pl-k.req)};
  });
}
function deadlines(){
  const out=[];
  curCourses().forEach(c=>(c.assess||[]).forEach(g=>{
    const k=Math.max(1,Math.max(+g.cnt||0,(g.items||[]).length,1)-(+g.drop||0));
    (g.items||[]).forEach(it=>{if(it.due&&(it.s==null||it.s==='')&&!it.st){const d=daysUntil(it.due.slice(0,10));if(d>=0)out.push({c,a:{n:it.n,w:(+g.w||0)/k,due:it.due.slice(0,10)},d})}});
  }));
  return out.sort((x,y)=>x.d-y.d);
}
function termCredits(id){return S.courses.filter(c=>c.term===id).reduce((a,c)=>a+c.credits,0)}

const stPill=c=>{const s=status(c);return s==='done'?'<span class="pill good">done</span>':s==='current'?'<span class="pill acc">in progress</span>':s==='planned'?'<span class="pill">planned</span>':'<span class="pill">not scheduled</span>'};

function spark(tr){
  if(tr.length<1)return'<div class="empty">The GPA curve appears once a term has graded courses.</div>';
  const W=600,H=170,L=34,R=18,T=14,B=26,max=Math.max.apply(null,S.settings.scale.map(x=>x.p))||4;
  const x=i=>tr.length===1?(L+W-R)/2:L+(W-L-R)*i/(tr.length-1),y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let v=0;v<=max+0.01;v+=1)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" style="fill:var(--muted);font:11px var(--f-mono)">${v}</text>`;
  const line=k=>tr.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join(' ');
  const area=line('cum')+` L${x(tr.length-1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  let dots='';tr.forEach((p,i)=>{dots+=`<circle cx="${x(i)}" cy="${y(p.term)}" r="3" style="fill:var(--surface);stroke:var(--muted)" stroke-width="1.5"/>`;dots+=`<circle cx="${x(i)}" cy="${y(p.cum)}" r="${i===tr.length-1?5:3}" style="fill:var(--accent)"/>`;
    dots+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0&&tr.length>1?'start':i===tr.length-1&&tr.length>1?'end':'middle'}" style="fill:var(--muted);font:10px var(--f-mono)">${esc(p.name)}</text>`});
  const last=tr[tr.length-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="GPA by term">${g}<path d="${area}" style="fill:var(--accent);opacity:.09"/><path d="${line('term')}" fill="none" style="stroke:var(--muted)" stroke-width="1.4" stroke-dasharray="3 3"/><path d="${line('cum')}" fill="none" style="stroke:var(--accent)" stroke-width="2.2"/>${dots}<text x="${Math.min(x(tr.length-1),W-R)}" y="${y(last.cum)-11}" text-anchor="end" style="fill:var(--accent);font:500 12px var(--f-mono)">${fmt(last.cum)}</text></svg>
  <div class="legend" style="margin-top:6px"><span><i style="background:var(--accent);border-color:var(--accent)"></i>Cumulative</span><span><i style="border-radius:99px"></i>Term</span></div>`;
}

function attention(){
  const out=[],m=byCode();
  let conf=0;S.courses.forEach(c=>{if(c.term&&prereqIssues(c).some(i=>i.kind!=='missing'))conf++});
  if(conf)out.push({t:'warn',x:`${conf} course${conf>1?'s are':' is'} scheduled before a prerequisite is finished`,to:'grid'});
  S.terms.forEach(t=>{const cr=loadOf(t.id);if(t.status!=='done'&&cr>S.settings.maxLoad)out.push({t:'warn',x:`${t.name} carries ${cr} credits, above your ${S.settings.maxLoad} credit limit`,to:'grid'})});
  const tg=S.settings.targetGpa;
  curCourses().forEach(c=>{const st=standing(c);if(st.pct!=null){const p=pointsOf(st.letter);if(p!=null&&p<tg-0.7)out.push({t:'bad',x:`${esc(c.code)} is at ${fmt(st.pct,1)}% (${esc(st.letter)}), well under your target`,course:c.id});}
    if(st.W&&Math.abs(st.W-100)>0.01)out.push({t:'warn',x:`${esc(c.code)} assessment weights add up to ${fmt(st.W,0)}%, not 100%`,course:c.id});
    if(!c.assess.length)out.push({t:'',x:`${esc(c.code)} has no assessments yet. Add them from its syllabus.`,course:c.id});});
  const placed=S.courses.filter(c=>termOf(c.term)&&counts(c)).reduce((a,c)=>a+c.credits,0),un=S.settings.totalCredits-placed;
  if(S.terms.length&&un>0)out.push({t:'',x:`${un} credits of your ${S.settings.totalCredits} are not in any term yet`,to:'req'});
  else if(S.terms.length&&un<0)out.push({t:'',x:`Your plan holds ${-un} credits beyond the ${S.settings.totalCredits} your degree needs, which is normal with a minor`,to:'req'});
  const ung=doneCourses().filter(c=>!c.grade&&counts(c)).length;
  if(ung)out.unshift({t:'',x:`${ung} finished courses have no final grade yet. Add them to see your GPA.`,to:'courses'});
  return out;
}

/* ---------- roadmap ---------- */
const ORD=['Entry courses','Second step','Third step','Fourth step','Fifth step','Sixth step','Seventh step','Eighth step'];
function chain(id,m,dir){
  const res={};
  (function walk(i){
    const c=getC(i);if(!c)return;
    const nxt=dir==='up'?(c.prereqs||[]).map(p=>m[NC(p)]).filter(Boolean):S.courses.filter(o=>(o.prereqs||[]).some(p=>NC(p)===NC(c.code)));
    nxt.forEach(n=>{if(!res[n.id]){res[n.id]=1;walk(n.id)}});
  })(id);
  return res;
}
function vRoadmap(){
  if(!S.courses.length)return head('Roadmap','How your courses build on each other.')+'<div class="empty">Add courses with their prerequisites and the map draws itself.</div>';
  const m=byCode(),NW=156,NH=48,GX=64,GY=12,PX=18,PY=34;
  let list=S.courses.filter(counts);
  if(U.hideDone)list=list.filter(c=>status(c)!=='done');
  const dep={};list.forEach(c=>dep[c.id]=depth(c,m));
  const maxD=Math.max.apply(null,list.map(c=>dep[c.id]).concat([0]));
  const cols=[];for(let i=0;i<=maxD;i++)cols.push(list.filter(c=>dep[c.id]===i).sort((a,b)=>(termIdx(a.term)<0?99:termIdx(a.term))-(termIdx(b.term)<0?99:termIdx(b.term))||a.code.localeCompare(b.code)));
  const pos={};cols.forEach((cs,i)=>cs.forEach((c,j)=>pos[c.id]={x:PX+i*(NW+GX),y:PY+j*(NH+GY)}));
  const W=PX*2+(maxD+1)*NW+maxD*GX,H=PY+Math.max.apply(null,cols.map(c=>c.length))*(NH+GY)+8;
  const up=U.sel?chain(U.sel,m,'up'):{},down=U.sel?chain(U.sel,m,'down'):{};
  const on=id=>!U.sel||id===U.sel||up[id]||down[id];
  let ed='';
  list.forEach(c=>(c.prereqs||[]).forEach(code=>{const p=m[NC(code)];if(!p||!pos[p.id]||!pos[c.id])return;
    const a=pos[p.id],b=pos[c.id],x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,mx=(x1+x2)/2;
    const hi=U.sel&&on(p.id)&&on(c.id);
    ed+=`<path class="ed ${hi?'hi':U.sel?'dim':''}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`}));
  let nd='';
  list.forEach(c=>{const p=pos[c.id],ns=nodeState(c,m),t=termOf(c.term);
    const title=c.title.length>20?c.title.slice(0,19)+'…':c.title;
    nd+=`<g class="nd ${ns} ${on(c.id)?'':'dim'}" data-a="sel" data-id="${c.id}" transform="translate(${p.x} ${p.y})" tabindex="0" role="button" aria-label="${esc(c.code+' '+c.title)}"><rect width="${NW}" height="${NH}" rx="7"/><text class="c" x="10" y="19">${esc(c.code)}${U.sel===c.id?'  ●':''}</text><text class="c" x="${NW-10}" y="19" text-anchor="end">${c.credits} cr</text><text class="n" x="10" y="37">${esc(title)}</text></g>`});
  let hd='';cols.forEach((cs,i)=>{if(cs.length)hd+=`<text class="colh" x="${PX+i*(NW+GX)}" y="18">${esc((ORD[i]||'Step '+(i+1)).toUpperCase())}</text>`});
  const s=U.sel?getC(U.sel):null;
  const info=s?`<div class="card row between" style="margin-top:14px"><div style="min-width:0"><span class="code">${esc(s.code)} · ${esc(catName(s.cat))}</span><h3>${esc(s.title)}</h3><div class="small muted" style="margin-top:4px">Needs ${Object.keys(up).length} course${Object.keys(up).length===1?'':'s'} before it · opens the way to ${Object.keys(down).length}</div></div><div class="row">${stPill(s)}<button class="btn" data-a="open" data-id="${s.id}">Open</button><button class="btn ghost" data-a="sel" data-id="">Clear</button></div></div>`:'';
  const open=S.courses.filter(c=>counts(c)&&nodeState(c,m)==='open').map(c=>({c,n:Object.keys(chain(c.id,m,'down')).length})).sort((a,b)=>b.n-a.n||a.c.code.localeCompare(b.c.code));
  return head('Roadmap','Read left to right. Each course sits one step after the longest chain of prerequisites that leads to it. Select a course to trace what it needs and what it opens.',`<button class="btn" data-a="hidedone">${U.hideDone?'Show finished courses':'Hide finished courses'}</button>`)+
  `<div class="map"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${hd}${ed}${nd}</svg></div>
  <div class="legend" style="margin-top:12px"><span><i style="background:var(--good-soft);border-color:var(--good)"></i>Finished</span><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>This term</span><span><i style="border-style:dashed"></i>Planned</span><span><i style="border-color:var(--accent);border-style:dotted"></i>Ready to take, not scheduled</span><span><i></i>Locked behind a prerequisite</span></div>${info}
  <div class="sec"><h2>Good next picks</h2>${open.length?`<div class="card list" style="padding:2px 16px">${open.slice(0,8).map(o=>`<div class="li click" data-a="open" data-id="${o.c.id}"><div><span class="code">${esc(o.c.code)} · ${o.c.credits} cr</span><h3>${esc(o.c.title)}</h3></div><span class="pill acc">opens ${o.n}</span></div>`).join('')}</div><p class="small muted">Courses you could schedule today, ranked by how many later courses depend on them.</p>`:'<div class="empty">Every unscheduled course is still waiting on a prerequisite, or everything is scheduled.</div>'}</div>`;
}

function gcard(c){
  const is=prereqIssues(c).filter(i=>i.kind!=='missing'),l=effLetter(c);
  return`<div class="cc ${status(c)} ${is.length?'warn':''}" draggable="true" data-drag="${c.id}" data-a="open" data-id="${c.id}" title="${is.length?'A prerequisite is not finished before this course':'Drag to another term, or tap to edit'}"><div class="t1"><span class="code">${esc(c.code)}</span><span class="mono small muted">${c.credits}${l?' · '+esc(l):''}</span></div><div class="t2">${esc(c.title)}</div></div>`;
}
function vGrid(){
  if(!S.terms.length)return head('Four years','Every term at a glance.')+setupPanel();
  const cat=S.courses.filter(c=>!termOf(c.term));
  const cols=S.terms.map(t=>{const cs=S.courses.filter(c=>c.term===t.id),cr=loadOf(t.id),all=termCredits(t.id),g=termGpa(t);
    return`<div class="term" data-drop="${t.id}"><header><b>${esc(t.name)}</b><span class="mono small ${cr>S.settings.maxLoad&&t.status!=='done'?'':'muted'}" style="${cr>S.settings.maxLoad&&t.status!=='done'?'color:var(--warn)':''}">${cr} cr${all>cr?` +${all-cr}`:''}</span></header><div class="row" style="margin:-4px 0 10px;gap:6px"><span class="pill ${t.status==='done'?'good':t.status==='current'?'acc':''}">${t.status==='done'?'finished':t.status==='current'?'current':'planned'}</span>${g.gpa!=null?`<span class="pill">GPA ${fmt(g.gpa)}</span>`:''}</div>${cs.map(gcard).join('')}${cs.length?'':'<div class="small muted">Drop courses here</div>'}</div>`}).join('');
  const tot=S.courses.filter(c=>termOf(c.term)&&counts(c)).reduce((a,c)=>a+c.credits,0);
  return head('Four years','Drag a course to move it between terms. On a phone, tap a course and pick its term. A dashed outline means a prerequisite is not finished before that course.',`<span class="pill">${tot} of ${S.settings.totalCredits} credits placed</span>`)+

}

/* ---------- GPA lab ---------- */
/* What the rest of the degree has to average. Retaken courses drop their old grade, CR courses carry no points, and credits not yet in a term still count as future work. */
function outlook(){
  const sc=S.settings.scale,maxP=Math.max.apply(null,sc.map(x=>x.p)),tg=S.settings.targetGpa,tot=S.settings.totalCredits,rp=S.settings.retakeReplaces!==false;
  const hasRt=c=>rp&&S.courses.some(o=>o.retakeOf===c.id),crTerm=c=>!!(termOf(c.term)||{}).cr;
  const base=gpaOf(doneCourses().filter(c=>!hasRt(c)),false);
  const rest=S.courses.filter(c=>status(c)!=='done'&&counts(c)&&!crTerm(c)).reduce((a,c)=>a+c.credits,0);
  const ung=doneCourses().filter(c=>counts(c)&&!c.grade&&!crTerm(c)).reduce((a,c)=>a+c.credits,0);
  const R=rest+ung+Math.max(0,tot-placedCredits()),N=base.cr+R;
  const need=R>0?(tg*N-base.pts)/R:null,best=R>0?(base.pts+maxP*R)/N:base.gpa;
  const retaken=S.courses.filter(c=>hasRt(c)&&c.grade);
  const cands=doneCourses().filter(c=>counts(c)&&!hasRt(c)&&c.grade&&!crTerm(c)&&pointsOf(c.grade)!=null&&pointsOf(c.grade)<maxP).map(c=>{
    const p=pointsOf(c.grade),w=rp?(base.pts-p*c.credits+maxP*(R+c.credits))/N:(base.pts+maxP*(R+c.credits))/(N+c.credits);
    return{c,p,gain:w-best};}).filter(x=>x.gain>=0.005).sort((a,b)=>b.gain-a.gain).slice(0,4);
  const retakes=S.courses.filter(o=>o.retakeOf&&getC(o.retakeOf));
  return{maxP,tg,R,N,base,need,best,cands,retakes,ung};
}
function vGpa(){
  const cum=cumulative(),o=outlook(),tg=o.tg,maxP=o.maxP;
  const lab=curCourses().concat(planCourses());
  const over=U.whatif;
  const pr=gpaOf(doneCourses().concat(lab),true,over);
  const ladder=[maxP,3.7,3.3,3,2.7].map(x=>({x,f:o.R>0?(o.base.pts+x*o.R)/o.N:cum.gpa}));
  const tr=trend();
  const curCr=curCourses().filter(c=>!(termOf(c.term)||{}).cr).reduce((a,c)=>a+c.credits,0);
  const thisNeed=curCr>0&&cum.cr>0?(tg*(cum.cr+curCr)-cum.pts)/curCr:null;
  const thisBest=curCr>0&&cum.cr>0?(cum.pts+maxP*curCr)/(cum.cr+curCr):null;
  const opts=sel=>['<option value="">–</option>'].concat(S.settings.scale.map(x=>`<option ${sel===x.l?'selected':''}>${x.l}</option>`)).join('');
  const far=o.need!=null&&o.need>maxP+1e-6,farT=thisNeed!=null&&thisNeed>maxP+1e-6;
  const rtNote=o.retakes.length?` It counts your retake${o.retakes.length>1?'s':''} of ${o.retakes.map(r=>esc((getC(r.retakeOf)||{}).code||r.code)).join(', ')}, which replace${o.retakes.length>1?'':'s'} the old grade.`:'';
  const card2=o.need==null?`<div class="num" style="margin:10px 0 6px">–</div><div class="small muted">Every degree credit is graded.</div>`:
    far?`<div class="num" style="margin:10px 0 6px;color:var(--bad);font-size:34px;line-height:1.35">Out of reach</div><div class="small muted">It would take an average of ${fmt(o.need)}, and the top grade is ${fmt(maxP,1)}. The best you can finish at is <b>${fmt(o.best)}</b> with straight ${fmt(maxP,1)}s from here.${rtNote}</div>`:
    `<div class="num" style="margin:10px 0 6px">${o.need<=0?'0.00':fmt(o.need)}</div><div class="small muted">${o.need<=0?'Already secured.':`average over the remaining ${o.R} credits. The best you can finish at is ${fmt(o.best)}.`}${rtNote}</div>`;
  const card3=thisNeed==null?`<div class="num" style="margin:10px 0 6px">–</div><div class="small muted">No graded credits yet.</div>`:
    farT?`<div class="num" style="margin:10px 0 6px;color:var(--bad);font-size:34px;line-height:1.35">Not this term</div><div class="small muted">Even straight ${fmt(maxP,1)}s only lift you to <b>${fmt(thisBest)}</b> this term. ${fmt(tg)} is a goal for later terms.</div>`:
    `<div class="num" style="margin:10px 0 6px">${thisNeed<=0?'0.00':fmt(thisNeed)}</div><div class="small muted">to sit at ${fmt(tg)} when this term posts. Straight ${fmt(maxP,1)}s would give ${fmt(thisBest)}.</div>`;
  return head('GPA lab','See where your GPA stands, what the rest of the degree has to average to reach your target, and what a few grades would do.')+
  `<div class="grid g3"><div class="card"><div class="lbl">Cumulative now</div><div class="num" style="margin:10px 0 6px">${fmt(cum.gpa)}</div><div class="small muted">${cum.cr} graded credits</div></div>
  <div class="card"><div class="lbl">Needed for ${fmt(tg)} at graduation</div>${card2}</div>
  <div class="card"><div class="lbl">Needed this term</div>${card3}</div></div>
  <div class="grid g2 sec"><div><h2>If you average…</h2><div class="card" style="padding:4px 16px">${ladder.map(l=>`<div class="kv"><span>${fmt(l.x,1)} on the remaining ${o.R} credits</span><span class="mono" style="color:var(--${l.f>=tg?'good':'bad'})">${fmt(l.f)}</span></div>`).join('')}${o.ung?`<div class="small muted" style="padding:8px 0">Includes ${o.ung} credits of finished courses with no grade entered yet.</div>`:''}</div>
  ${o.cands.length?`<h2 style="margin-top:22px">Worth retaking</h2><div class="card" style="padding:4px 16px">${o.cands.map(x=>`<div class="kv"><span>${esc(x.c.code)} · ${esc(x.c.grade)} · ${x.c.credits} cr</span><span class="mono" style="color:var(--good)">+${fmt(x.gain)}</span></div>`).join('')}<div class="small muted" style="padding:8px 0">How much higher you could finish if you retook it and earned ${fmt(maxP,1)}.</div></div>`:''}</div>
  <div><h2>By term</h2><div class="card scroll" style="padding:4px 16px"><table class="t"><thead><tr><th>Term</th><th class="r">Credits</th><th class="r">GPA</th><th class="r">Cumulative</th></tr></thead><tbody>${tr.map(r=>{const t=S.terms.find(x=>x.name===r.name);return`<tr><td>${esc(r.name)}${r.cur?' <span class="pill acc">so far</span>':''}</td><td class="r mono">${t?termCredits(t.id):''}</td><td class="r mono">${fmt(r.term)}</td><td class="r mono">${fmt(r.cum)}</td></tr>`}).join('')||'<tr><td colspan="4" class="muted">No graded terms yet</td></tr>'}</tbody></table></div></div></div>
`+termPlanSection()+whatIf(cum)+transcriptSection();
}

}

function transcript(){
  const out=[];let done=[];
  S.terms.forEach(t=>{
    if(t.status==='planned')return;const cs=S.courses.filter(c=>c.term===t.id);if(!cs.length)return;
    if(t.status==='done')done=done.concat(cs);
    const rows=cs.map(c=>{const g=c.grade||(t.status==='current'?standing(c).letter:'');return{code:c.code,title:c.title,cr:c.credits,grade:g?(t.status==='current'&&!c.grade?g+' (so far)':g):(t.status==='current'?'In progress':'–'),pts:c.grade&&pointsOf(c.grade)!=null?pointsOf(c.grade):null,note:c.retakeOf?'Retake':S.courses.some(o=>o.retakeOf===c.id)?'Retaken':''}});
    out.push({name:t.name,status:t.status,cr:!!t.cr,rows,credits:cs.reduce((a,c)=>a+c.credits,0),tg:t.status==='done'&&!t.cr?gpaOf(cs,false).gpa:null,cg:t.status==='done'?gpaOf(done,false).gpa:null});
  });
  return out;
}

function minorRows(mn){

  (mn.slots||[]).forEach(sl=>slotIds(sl).forEach(id=>{if(getC(id))used[id]=1}));
  (mn.slots||[]).forEach(sl=>{
    const n=Math.max(1,+sl.n||1),own=slotIds(sl).map(getC).filter(Boolean),cs=own.slice();
    if(cs.length<n){const cand=[];(sl.opts||[]).forEach(o=>aliases(o).forEach(a=>S.courses.forEach(x=>{if(NC(x.code)===a&&!used[x.id]&&counts(x)&&cand.indexOf(x)<0)cand.push(x)})));
      cand.sort((a,b)=>rank[status(a)]-rank[status(b)]);for(const x of cand){if(cs.length>=n)break;cs.push(x);used[x.id]=1}}
    for(let i=0;i<n;i++){const c=cs[i]||null,st=c?(termOf(c.term)?status(c):'catalog'):'none';

function parseReq(text,cr){
  const out=[];
  String(text||'').split(/\n/).forEach(raw=>{
    const lines=/\s+or\s+/i.test(raw)?[raw]:raw.split(',');
    lines.map(x=>x.trim()).filter(Boolean).forEach(line=>{
      let n=1;const m=line.match(/\s+x\s*(\d)$/i);if(m){n=+m[1];line=line.slice(0,m.index).trim()}
      const alts=line.split(/\s+or\s+|;|\|/i).map(x=>x.trim()).filter(Boolean),coded=alts.filter(a=>aliases(a).length);
      for(let i=0;i<n;i++)out.push(coded.length?{id:uid(),label:'',opts:alts,cr,pick:0,ids:[]}:{id:uid(),label:line,opts:[],cr,pick:0,ids:[]});
    });
  });
  return out;
}

}

/* ---------- this term: goals and what each course needs ---------- */
function termPlan(){
  const t=S.terms.find(x=>x.status==='current');if(!t||t.cr)return null;
  const cs=S.courses.filter(c=>c.term===t.id);if(!cs.length)return null;
  const cum=cumulative(),o=outlook(),maxP=o.maxP,tg=S.settings.targetGpa;
  const sc=S.settings.scale.slice().sort((a,b)=>a.p-b.p||a.min-b.min);
  const rows=cs.map(c=>{const st=standing(c),has=st.W>0;
    const fl=has?(pointsOf(letterFor(st.floor))||0):0,ce=has?(pointsOf(letterFor(st.ceil)))||0:maxP;
    return{c,st,has,fl,ce,ceL:has?letterFor(st.ceil):null};});
  const crT=rows.reduce((a,r)=>a+r.c.credits,0);
  const need=cum.cr>0?(tg*(cum.cr+crT)-cum.pts)/crT:tg;
  const T=need*crT,lo=rows.reduce((a,r)=>a+r.c.credits*r.fl,0),hi=rows.reduce((a,r)=>a+r.c.credits*r.ce,0);
  const state=T<=lo+1e-9?'secured':T>hi+1e-9?'out':'plan';
  let L=0;
  if(state==='plan'){let a=0,b=maxP;for(let i=0;i<40;i++){const m=(a+b)/2,f=rows.reduce((s,r)=>s+r.c.credits*Math.min(r.ce,Math.max(r.fl,m)),0);if(f<T)a=m;else b=m}L=b}
  rows.forEach(r=>{
    r.aimP=state==='plan'?Math.min(r.ce,Math.max(r.fl,L)):state==='secured'?r.fl:r.ce;
    const aim=sc.find(x=>x.p>=r.aimP-1e-9&&x.p>0)||sc[sc.length-1];r.aim=aim.l;r.aimMin=aim.min;
    const g=r.c.goal&&sc.find(x=>x.l===r.c.goal);r.goal=g?g.l:'';r.goalMin=g?g.min:null;
    const tgtMin=g?g.min:aim.min;r.need=r.has?needed(r.c,tgtMin):null;
    r.pts=g?g.p:r.aimP;
  });
  const sum=rows.reduce((a,r)=>a+r.c.credits*r.pts,0),proj=sum/crT,after=(cum.pts+sum)/(cum.cr+crT);
  return{t,rows,need,state,crT,proj,after,cum,maxP,tg,best:(hi/crT)};
}

const DAYN=['M','T','W','Th','F','Sa','Su'],DAYL={M:'Mon',T:'Tue',W:'Wed',Th:'Thu',F:'Fri',Sa:'Sat',Su:'Sun'};
const hm=m=>{const h=Math.floor(m/60),mm=m%60;return(h%12||12)+':'+String(mm).padStart(2,'0')+(h<12?'a':'p')};
function toMin(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return v.getHours()*60+v.getMinutes();
  if(typeof v==='number')return Math.round((v%1)*1440);
  const m=String(v).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);if(!m)return null;
  let h=+m[1];if(m[3]){const p=m[3].toLowerCase();if(p==='pm'&&h<12)h+=12;if(p==='am'&&h===12)h=0}return h*60+(+m[2]);

/* flexible column index: tries exact match first, then alias map */
function colIx(hdr){
  const map={};hdr.forEach((h,i)=>map[h]=i);
  function ix(name){
    if(map[name]!=null)return map[name];
    const aliases={
      'semester':['term'],'term':['semester'],
      'day':['day(s)','days'],'day(s)':['day','days'],
      'tot enrl':['total enrolled','enrollment','enrl tot'],
      'offering program':['program','prog'],
      'class nbr':['class number','classnbr'],
      'course title':['title','course_title'],
    };
    const al=aliases[name]||[];
    for(const a of al)if(map[a]!=null)return map[a];
    /* partial match as last resort — both sides must be at least 3 chars */
    if(name.length>=3)for(const h of hdr)if(h.length>=3&&(h.includes(name)||name.includes(h)))return map[h];
    return -1;
  }
  return ix;
}

/* ---------- auto-schedule generator ---------- */
function autoSchedule(courseList,sections){
  /* courseList: [{c,options:[section,...]},...] */
  const n=courseList.length;if(!n)return[];
  const results=[],cur=[];
  function clash2(sa,sb){
    for(const a of sa.meets)for(const b of sb.meets)if(a.d===b.d&&a.s<b.e&&b.s<a.e)return true;
    return false;
  }
  function clashWith(sec){
    for(let i=0;i<cur.length;i++)if(clash2(cur[i],sec))return true;
    return false;
  }
  function solve(i){
    if(results.length>=50)return; /* cap at 50 to avoid slowness */
    if(i===n){results.push(cur.slice());return}
    const opts=courseList[i].options;
    for(let j=0;j<opts.length;j++){
      if(!clashWith(opts[j])){cur.push(opts[j]);solve(i+1);cur.pop()}
    }
  }
  solve(0);
  return results;
}

function scoreSchedule(combo,prefs){
  let score=0;
  const pref=prefs||{};
  combo.forEach(sec=>{
    /* time preference: prefer mornings (before 2pm), penalise late (after 5pm) */
    sec.meets.forEach(m=>{
      if(pref.time==='morning'){score+=m.s<14*60?2:m.s<17*60?0:-2}
      else if(pref.time==='afternoon'){score+=m.s>=12*60&&m.s<17*60?2:0}
      else if(pref.time==='evening'){score+=m.s>=16*60?2:0}
    });
    /* instructor preference */
    if(pref.prefInstructor&&sec.ins){
      const prI=pref.prefInstructor.toLowerCase();
      if(sec.ins.toLowerCase().includes(prI))score+=5;
    }
    if(pref.avoidInstructor&&sec.ins){
      const avI=pref.avoidInstructor.toLowerCase();
      if(sec.ins.toLowerCase().includes(avI))score-=5;
    }
    /* EE reserved seats bonus */
    const ri=resInfo(sec);
    if(ri&&ri.mySeats>0)score+=3;
    if(ri&&ri.mySeats>=15)score+=2;
    /* prefer fewer gaps in the day */
  });
  return score;
}

function findSchedules(){
  const E=S.enroll;if(!E)return[];
  const t=enrollTerm();if(!t)return[];
  const cs=S.courses.filter(c=>c.term===t.id);
  const courseList=cs.map(c=>{
    const opts=offered(c);
    return{c,options:opts.filter(s=>s.meets.length)};
  }).filter(x=>x.options.length);
  if(!courseList.length)return[];
  const combos=autoSchedule(courseList);
  const prefs=U.enrPrefs||{};
  const scored=combos.map(combo=>{
    const items=combo.map((sec,i)=>({c:courseList[i].c,s:sec}));
    const sc=scoreSchedule(combo,prefs);
    return{items,score:sc};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,10);
}

function applySchedule(idx){
  const scheds=findSchedules();
  if(!scheds[idx])return;
  const E=S.enroll;
  E.picks={};
  scheds[idx].items.forEach(x=>{E.picks[x.c.id]=x.s.k});
  persist();render();
}

const cap=n=>{try{return window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};

async function saveFile(name,data){
  if(window.atlasHost&&window.atlasHost.saveFile){const r=await window.atlasHost.saveFile(name,data);if(r&&r.canceled)throw{code:'declined'};return}
  const dl=await cap('downloads');

  const type=/\.pdf$/.test(name)?'application/pdf':/\.csv$/.test(name)?'text/csv':'application/json';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function callAI(prompt,images){
  if(U.hasSample){const sp=await cap('sample');return await sp.json(prompt,images.length?{images}:{})}
  if(AI.key){
    const parts=[{text:prompt}];
    for(const f of images)parts.push({inline_data:{mime_type:f.type||'image/jpeg',data:await b64(f)}});
    let r;
    try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(AI.model||'gemini-2.5-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':AI.key},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{responseMimeType:'application/json',temperature:0}})})}catch(e){throw{code:'network'}}
    if(!r.ok){let m='';try{m=((await r.json()).error||{}).message||''}catch(x){}if(r.status===400&&/api key|API_KEY/i.test(m)||r.status===403)throw{code:'bad_key',status:r.status};throw{code:r.status===429?'rate_limited':'upstream_error',status:r.status,message:m}}
    const j=await r.json(),ps=(((j.candidates||[])[0]||{}).content||{}).parts||[],t=ps.map(p=>p.text||'').join('');
    try{return JSON.parse(t)}catch(e){const m=t.match(/[\{\[][\s\S]*[\}\]]/);if(m){try{return JSON.parse(m[0])}catch(x){}}throw{code:'invalid_json'}}
  }
  throw{code:'no_ai'};
}

}

  sf(e,d,v){const g=S.settings.scale[+d.i];g[d.f]=d.f==='l'?v.trim():(num(v)||0)},
  syl(e,d,v){const o=U.syl.out;o[d.f]=d.f==='credits'?(num(v)||0):d.f==='prereqs'?splitList(v):v},
  sylA(e,d,v){const a=U.syl.out.assessments[+d.i];a[d.f]=['weight','count','drop'].includes(d.f)?(num(v)||0):v},
  wi(e,d,v){if(v)U.whatif[d.id]=v;else delete U.whatif[d.id]},
  wiall(e,d,v){if(v){curCourses().concat(planCourses()).filter(c=>!U.wiTerm||U.wiTerm==='all'||c.term===U.wiTerm).forEach(c=>U.whatif[c.id]=v)}},
};
async function onFiles(e){
  const files=Array.from(e.target.files||[]),y=U.syl;let msg=[];
  for(const f of files){
    try{
      if(/^image\//.test(f.type)){if(y.files.length<(U.imgMax||0))y.files.push(f);else msg.push('Too many images; kept the first '+U.imgMax)}
      else if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){try{y.text+=(y.text?'\n\n':'')+await pdfText(f)}catch(pe){if(AI.key&&!U.hasSample){y.files.push(f.type?f:new File([f],f.name,{type:'application/pdf'}));msg.push(f.name+' will be sent to Gemini as a PDF.')}else throw pe}}
      else y.text+=(y.text?'\n\n':'')+await f.text();
    }catch(err){msg.push('Could not read '+f.name+(err&&err.message?' ('+err.message+')':'')+(/pdf/i.test(f.name)?'. Copy the text out of the PDF and paste it instead.':''))}
  }
  y.msg=msg.join(' ');render();
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
async function pdfText(file){
  const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib)await loadScript(B+'pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';
  const doc=await Promise.race([window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,new Promise((_,r)=>setTimeout(()=>r(new Error('slow')),25000))]);
  let out='';for(let i=1;i<=Math.min(doc.numPages,25);i++){const p=await doc.getPage(i);const t=await p.getTextContent();out+=t.items.map(x=>x.str).join(' ')+'\n'}
  if(out.replace(/\s/g,'').length<80)throw new Error('empty');return out;
}
async function onImport(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.terms)||!Array.isArray(o.courses)||!o.settings)throw 0;
    const b=blank();S=Object.assign(b,o,{settings:Object.assign(b.settings,o.settings)});S.sample=!!o.sample;persist();render();toast('Backup restored')}
  catch(err){toast('That file is not an Atlas backup')}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('select,input,textarea'))return;
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=ACT[el.dataset.a]||ACT2[el.dataset.a];if(!f)return;
  if(el.dataset.a==='closebg'&&e.target!==el)return;
  if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();
  f(e,el.dataset);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&U.course){U.course=null;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('g.nd')){e.preventDefault();ACT.sel(e,e.target.closest('g.nd').dataset)}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.c==='syltext')U.syl.text=e.target.value});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.c;if(!k)return;
  if(k==='syltext'){U.syl.text=t.value;return}
  if(k==='sylf'){onFiles(e);return}
  if(k==='impf'){onImport(e);return}
  if(k==='enrf'){onOffers(e);return}
  if(k==='ai'){AI[t.dataset.f]=t.value.trim();try{localStorage.setItem(LSAI,JSON.stringify(AI))}catch(x){}U.imgMax=U.hasSample?U.imgMax:(AI.key?8:0);render();return}
  const f=CHG[k]||CHG2[k];if(!f)return;
  try{f(e,t.dataset,t.value)}catch(err){console.error(err);return}
  if(k==='syl'||k==='sylA'||k==='wi'||k==='wiall'||k==='enrterm'||k==='enrq'||k==='mpick'||k==='enrpref'){render();return}
  persist();render();
});
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(!c)return;dragId=c.dataset.drag;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragover',e=>{const t=e.target.closest&&e.target.closest('[data-drop]');if(!t||!dragId)return;e.preventDefault();document.querySelectorAll('.term.over').forEach(x=>{if(x!==t)x.classList.remove('over')});t.classList.add('over')});
document.addEventListener('drop',e=>{const t=e.target.closest&&e.target.closest('[data-drop]');document.querySelectorAll('.term.over').forEach(x=>x.classList.remove('over'));if(!t||!dragId)return;e.preventDefault();const c=getC(dragId);dragId=null;if(c){c.term=t.dataset.drop||null;persist();render()}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.term.over').forEach(x=>x.classList.remove('over'))});
window.addEventListener('hashchange',routeFromHash);

/* ---------- saving ---------- */
const LS='course-atlas.v1';
let dbDoc=null,timer=null,saving=false,pendingSave=false;
function setSync(t){U.sync=t;const f=$('.sidefoot');if(f)f.textContent=t}
persist=function(){
  U.touched=true;
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(HOST){setSync('Saving…');clearTimeout(timer);timer=setTimeout(()=>HOST.save(JSON.stringify(S)).then(()=>setSync('Saved on this computer'),()=>setSync('Could not save to the data file')),400);return}
  if(!dbDoc){setSync('Saved in this browser');return}
  setSync('Saving…');clearTimeout(timer);timer=setTimeout(flush,700);
};
async function flush(){
  if(!dbDoc)return;
  if(saving){pendingSave=true;return}
  saving=true;
  try{await dbDoc.set({state:JSON.stringify(S),at:Date.now()});setSync('Saved to your account')}
  catch(e){setSync('Saved in this browser only')}
  saving=false;if(pendingSave){pendingSave=false;flush()}
}
function migrateCourse(c){c.assess=(c.assess||[]).map(a=>a.items?a:{id:a.id||uid(),n:a.n,type:a.type||'Other',w:+a.w||0,cnt:1,drop:0,items:[{id:uid(),n:a.n,s:a.s==null?null:+a.s,m:100,due:a.due||'',st:'',late:false}]});if(!c.coreqs)c.coreqs=[]}
function migrateMinor(m){
  if(Array.isArray(m.slots)){m.slots.forEach(s=>{if(!s.ids){s.ids=s.courseId?[s.courseId]:[];delete s.courseId}});return m}
  return{id:m.id||uid(),name:m.name,unit:'',credits:+m.credits||0,minGrade:'',note:'',slots:(m.codes||[]).map(c=>({id:uid(),label:'',opts:[c],cr:3,pick:0,ids:[]}))};
}
function upgrade(o){
  const b=blank(),st=Object.assign(b,o,{settings:Object.assign(b.settings,o.settings||{})});
  if(!o.v||o.v<3){
    /* older saved plans are rebuilt from the current starting plan, keeping any final grades and settings you had entered */
    const old={};(o.courses||[]).forEach(c=>{const t=(o.terms||[]).find(x=>x.id===c.term);if(c.grade)old[NC(c.code)+'|'+(t?t.name:'')]=c.grade});
    const ns=seed();ns.courses.forEach(c=>{const t=ns.terms.find(x=>x.id===c.term),g=old[NC(c.code)+'|'+(t?t.name:'')];if(g&&!c.grade)c.grade=g});
    if(o.settings&&o.settings.targetGpa)ns.settings.targetGpa=o.settings.targetGpa;
    return ns;
  }
  st.courses.forEach(migrateCourse);
  st.minors=(st.minors||[]).map(migrateMinor);
  if(st.minors.length)ensureMinorCat(st.settings);
  if(!st.settings.unit&&/habib/i.test(st.settings.school||''))st.settings.unit='DSSE';
  st.v=4;return st;
}
function adopt(o){S=upgrade(o);S.sample=false}
async function boot(){
  let local=null;try{const r=localStorage.getItem(LS);if(r)local=JSON.parse(r)}catch(e){}
  if(HOST){try{HC=await HOST.config()}catch(e){}try{const r=await HOST.load();if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.terms)&&!o.sample)local=o}}catch(e){}}
  try{const a=localStorage.getItem(LSAI);if(a)AI=Object.assign(AI,JSON.parse(a))}catch(e){}
  if(local&&Array.isArray(local.terms)&&!local.sample){const was=local.v;adopt(local);if(!was||was<3)try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}setSync(HOST?'Saved on this computer':'Saved in this browser');if(HOST)HOST.save(JSON.stringify(S))}
  else{S=seed();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}setSync(HOST?'Saved on this computer':'Saved in this browser');if(HOST)HOST.save(JSON.stringify(S))}
  routeFromHash();
  try{const sp=await cap('sample');U.hasSample=!!sp;if(sp&&sp.limits){const l=await sp.limits().catch(()=>null);U.imgMax=l&&l.images?l.images.maxCount:0}else U.imgMax=AI.key?8:0}catch(e){}
  render();
  try{
    const [db,user]=await Promise.all([cap('db'),cap('user')]);
    const id=user?await user.id():null;
    if(!db||!id)return;
    const ref=db.doc('data/users/'+id+'/planner');
    const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error('slow')),10000))]);
    dbDoc=ref;
    let o=null;if(snap.exists&&snap.data().state){try{o=JSON.parse(snap.data().state)}catch(e){}}
    if(o&&!o.sample&&Array.isArray(o.terms)){if(!U.touched){adopt(o);setSync('Saved to your account');render();if(!o.v||o.v<3)flush()}else flush()}
    else flush();
  }catch(e){setSync('Saved in this browser')}
}
boot();
})();
</script>
